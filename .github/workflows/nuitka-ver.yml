name: Build

# manual only, run it from the Actions tab
on:
  workflow_dispatch:

jobs:
  build:
    name: linux-x64
    runs-on: ubuntu-22.04

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true

      # nuitka needs it to make onefile builds on linux
      - name: Install patchelf
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf

      - name: Install dependencies
        run: |
          python -m pip install nuitka

      # nuitka asks for 2 zstd threads, but the runners' python has no thread support
      - name: Check version
        run: |
          python -m nuitka --version
