name: Build Hello

# manual only, run it from the Actions tab
on:
  workflow_dispatch:

jobs:
  build:
    name: linux-x64
    runs-on: ubuntu-22.04

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true

      # nuitka needs it to make onefile builds on linux
      - name: Install patchelf
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install nuitka

      - name: Build no patch
        continue-on-error: true
        run: |
          python nuitka/build_exe.py

      # nuitka asks for 2 zstd threads, but the runners' python has no thread support
      - name: Patch zstd threads
        shell: python
        run: |
          import pathlib, subprocess, sys
          from compression import zstd
          from compression.zstd import _zstdfile

          # only needed if this python's zstd has no thread support
          if zstd.CompressionParameter.nb_workers.bounds()[1] == 0:
              path = pathlib.Path(_zstdfile.__file__)

              # 400 is zstd's nbWorkers parameter
              path.write_text(path.read_text() + '''

          _orig_ZstdCompressor = ZstdCompressor
          def ZstdCompressor(level=None, options=None, zstd_dict=None):
              if options:
                  options = {k: v for k, v in options.items() if k != 400}
              return _orig_ZstdCompressor(level=level, options=options, zstd_dict=zstd_dict)
          ''')

          # fail here, in seconds, instead of after the 6 minute build
          subprocess.run([sys.executable, "-c", """
          import io
          from compression import zstd
          zstd.open(io.BytesIO(), "wb", options={zstd.CompressionParameter.nb_workers: 2}).close()
          print("zstd ok")
          """], check=True)

      - name: Build
        run: |
          python nuitka/build_exe.py

      - uses: actions/upload-artifact@v4
        with:
          name: bang-linux-x64
          path: build/*.zip
          if-no-files-found: error